services:
  hermes-base:
    image: hermes_base
    build:
      context: .
      dockerfile: docker/Dockerfile.base_cpu
    command: ["true"]

  mariadb:
    image: mariadb:11.4
    container_name: hermes-mariadb
    restart: unless-stopped
    networks:
      - hermes-network
    env_file:
      - docker/common.env
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-hermes_root_pass}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-hermes_staging}
      MARIADB_USER: ${MARIADB_USER:-hermes_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-hermes_pass}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb_data_vol:/var/lib/mysql
      - ./src/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized || mariadb-admin ping -h localhost -u$${MARIADB_USER:-hermes_user} -p$${MARIADB_PASSWORD:-hermes_pass} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  init_staging:
    depends_on:
      hermes-base:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
    build:
      context: .
      dockerfile: docker/Dockerfile.staging
      additional_contexts:
        hermes_base: service:hermes-base
    volumes:
      - ${LOCAL_SQL_DB_PATH}:/app/sqlite_data
      - ./src/init.sql:/init.sql
      - ./src/staging:/src/staging
      - ./.env:/.env
    networks:
      - hermes-network
    env_file:
      - docker/common.env
    command: ["python3", "-u", "/src/staging/init_db.py"]

  staging:
    depends_on:
      hermes-base:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
      init_staging:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: docker/Dockerfile.staging
      additional_contexts:
        hermes_base: service:hermes-base
    volumes:
      - ${ASTERISK_RECORDINGS_PATH}:/asterisk_recordings
      - ${LOCAL_SQL_DB_PATH}:/app/sqlite_data
      - ./src/init.sql:/init.sql
      - ./src/staging:/src/staging
      - ./.env:/.env
    networks:
      - hermes-network
    env_file:
      - docker/common.env

  test_asr:
    depends_on:
      hermes-base:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: docker/Dockerfile.asr_cpu
      additional_contexts:
        hermes_base: service:hermes-base
    networks:
      - hermes-network
    volumes:
      - ./logs/:/logs
      - ./src/asr:/src
      - /tmp:/tmp
      - ./config.json:/config.json
      - ./.env:/.env
      - ./test_audios:/test_audios
    env_file:
      - docker/common.env
    command: >
      sh -c "
        python3 -u /src/test_quick.py > /test_audios/asr_test.latest.log 2>&1 && 
        cat /test_audios/asr_test.latest.log
      "

  hermes-api:
    depends_on:
      hermes-base:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
      test_asr:
        condition: service_completed_successfully
      init_staging:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: docker/Dockerfile.hermes
      additional_contexts:
        hermes_base: service:hermes-base
    ports:
      - "${HERMES_PORT}:${HERMES_PORT}"
    networks:
      - hermes-network
    volumes:
      - ${ASTERISK_RECORDINGS_PATH}:/asterisk_recordings
      - ${LOCAL_SQL_DB_PATH}:/app/sqlite_data
      - ./logs/:/logs
      - hf_cache_vol:/tmp/hf_cache_dir
      - ./src/hermes:/src/hermes
      - ./.env:/.env
    environment:
      - FASTAPI_MODE=${FASTAPI_MODE:-run}
    env_file:
      - docker/common.env

  hermes-ner:
    depends_on:
      hermes-base:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
      test_asr:
        condition: service_completed_successfully
      init_staging:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: docker/Dockerfile.ner_cpu
      additional_contexts:
        hermes_base: service:hermes-base
    networks:
      - hermes-network
    #ports:
    #  - "XXXX:XXXX"
    volumes:
      - ${LOCAL_SQL_DB_PATH}:/app/sqlite_data
      - ./logs/:/logs
      - hf_cache_vol:/tmp/hf_cache_dir
      - ./datasets:/datasets
      - ./src/ner:/src
      - /tmp:/tmp
      - ./config.json:/config.json
      - ./.env:/.env
    env_file:
      - docker/common.env

  hermes-asr:
    depends_on:
      hermes-base:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
      init_staging:
        condition: service_completed_successfully
      test_asr:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: docker/Dockerfile.asr_cpu
      additional_contexts:
        hermes_base: service:hermes-base
    networks:
      - hermes-network
    volumes:
      - ${LOCAL_SQL_DB_PATH}:/app/sqlite_data
      - ./logs/:/logs
      - hf_cache_vol:/tmp/hf_cache_dir
      - ./src/asr:/src
      - /tmp:/tmp
      - ./config.json:/config.json
      - ./.env:/.env
    env_file:
      - docker/common.env

  hermes-interpretation:
    depends_on:
      hermes-base:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
      test_asr:
        condition: service_completed_successfully
      init_staging:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: docker/Dockerfile.interpretation
      additional_contexts:
        hermes_base: service:hermes-base
    #ports:
    #  - "XXXX:XXXX"
    networks:
      - hermes-network
    volumes:
      - ${LOCAL_SQL_DB_PATH}:/app/sqlite_data
      - ./logs/:/logs
      - hf_cache_vol:/tmp/hf_cache_dir
      - ./src/interpretation:/src
      - /tmp:/tmp
      - ./datasets:/datasets
      - ./config.json:/config.json
      - ./.env:/.env
    env_file:
      - docker/common.env

volumes:
  hf_cache_vol:
  mariadb_data_vol:

networks:
  hermes-network:
    name: hermes-network
    external: true
    ipam:
      config:
        - subnet: 172.20.0.0/16 # Defines the IP range for the network