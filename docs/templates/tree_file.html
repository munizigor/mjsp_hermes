<li class="tree-file" data-page-id="{{PAGE_ID}}" data-path="{{PAGE_PATH}}" data-title="{{PAGE_TITLE}}">
    <a href="#page={{PAGE_ID}}" class="tree-file-link" onclick="selectPage('{{PAGE_ID}}', event)">
        <span class="tree-file-icon">{{ICON}}</span>
        <span class="tree-file-labels">
            <span class="tree-file-name">{{PAGE_NAME}}<span class="tree-badge {{BADGE_CLASS}}">{{BADGE_TEXT}}</span></span>
            <span class="tree-file-subtitle">{{PAGE_TITLE}}</span>
        </span>
    </a>
</li>
